name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Postman collection via Newman
        run: npm run newman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman-report
